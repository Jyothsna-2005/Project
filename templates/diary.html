<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenzest - Personal diary</title>
    <link rel="icon" type="image/png" href="../static/assets/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Segoe UI, sans-serif
        }

        body {
            background: #f7f7f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh
        }

        .container {
            width: 100%;
            max-width: 1100px;
            height: 92vh;
            display: flex;
            background: #fff;
            border-radius: 14px;
            overflow: hidden
        }

        .sidebar {
            width: 32%;
            border-right: 1px solid #e5e5e5;
            padding: 18px;
            align-items: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px
        }

        .add-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            padding: 0;
        }

        .note-item {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            align-items: center;
        }

        .notesList {
            align-items: center;
        }

        .note-item.active {
            background: #f1f3f5;
            align-items: center;
        }

        .note-title {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 500;
            color: #111
        }

        .empty {
            color: #aaa;
            text-align: center;
            margin-top: 60px
        }

        .editor {
            width: 68%;
            padding: 20px 24px;
            display: flex;
            flex-direction: column
        }

        .toolbar {
            width: 100%;
            justify-content: space-evenly;
            display: none;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .toolbar button,
        .toolbar select {
            border: none;
            background: transparent;
            padding: 6px;
            cursor: pointer;
            border-radius: 6px
        }

        .toolbar button:hover {
            background: #f1f1f1
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            border: none;
            outline: none;
            margin: 10px 0;
            display: none
        }

        .editor-area {
            flex: 1;
            font-size: 16px;
            line-height: 1.6;
            outline: none;
            display: none;
            overflow-wrap: break-word;
        }

        .editor-area:empty:before {
            content: "Start writing...";
            color: #aaa
        }

        .editor-area ul,
        .editor-area ol {
            padding-left: 18px;
            margin: 0;
        }

        .editor-area li {
            list-style-position: inside;
            /* keeps bullet/number inline */
            padding-left: 0;
            margin: 0;
            word-break: break-word;
            /* prevents overflow */
        }

        .actions {
            margin-top: 12px;
            display: none;
        }

        .actions button {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            margin-right: 8px;
            cursor: pointer;
            width: 30%;
            height: 50px;
        }

        .save-btn {
            background: #111;
            color: #fff
        }

        .delete-btn {
            background: #eee
        }

        .quote {
            text-align: center;
            color: #777;
            font-size: 18px;
            margin: auto;
            max-width: 400px;
            line-height: 1.6;
        }

        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;

            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 8px;
            cursor: pointer;
        }

        .back-arrow img {
            width: 18px;
            height: 18px;
        }

        /* MODAL BACKDROP */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* MODAL BOX */
        .modal-box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* TEXT */
        .modal-box p {
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
        }

        /* BUTTONS */
        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .cancel-btn {
            flex: 1;
            padding: 8px;
            background: #eee;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .confirm-btn {
            flex: 1;
            padding: 8px;
            background: #111;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .toolbar button.active {
            background: #e0e0e0;
        }
    </style>
</head>

<body>
    <a class="back-arrow" onclick="window.location.href='/home';">
        <img src="../static/assets/left.png" alt="">
    </a>
    <div class="container">

        <div class="sidebar">
            <div class="header">
                <h3>Personal Diary</h3>
                <button class="add-btn" onclick="addNote()">+</button>
            </div>
            <div id="notesList"></div>
            <div id="emptyState" class="empty">No notes yet</div>
        </div>

        <div class="editor">

            <!-- QUOTE DEFAULT VIEW -->
            <div id="quoteBox" class="quote">
                "Your thoughts deserve a safe place. Write freely, reflect deeply, and grow every day."
            </div>

            <!-- TOOLBAR -->
            <div class="toolbar" id="toolbar">
                <select onchange="format('fontSize',this.value)">
                    <option value="1">Small</option>
                    <option value="3">Normal</option>
                    <option value="5">Large</option>
                    <option value="7">Huge</option>
                </select>
                <button id="boldBtn" onclick="format('bold')"><img src="../static/assets/bold.png" alt="" width="15px"
                        style="margin-top: 5px;"></button>
                <button id="italicBtn" onclick="format('italic')"><img src="../static/assets/italic-font.png" alt=""
                        width="15px" style="margin-top: 5px;"></button>
                <button id="underlineBtn" onclick="format('underline')"><img src="../static/assets/underline.png" alt=""
                        width="15px" style="margin-top: 5px;"></button>
                <button id="leftBtn" onclick="format('justifyLeft')"><img src="../static/assets/align-left.png" alt=""
                        width="15px" style="margin-top: 5px;"></button>
                <button id="centerBtn" onclick="format('justifyCenter')"><img src="../static/assets/format.png" alt=""
                        width="15px" style="margin-top: 5px;"></button>
                <button id="rightBtn" onclick="format('justifyRight')"><img src="../static/assets/align-right.png"
                        alt="" width="15px" style="margin-top: 5px;"></button>
                <button id="ulBtn" onclick="format('insertUnorderedList')"><img src="../static/assets/point.png" alt=""
                        width="15px" style="margin-top: 5px;"></button>
                <button id="olBtn" onclick="format('insertOrderedList')"><img src="../static/assets/list.png" alt=""
                        width="15px" style="margin-top: 5px;"></button>
            </div>

            <input id="noteTitle" class="title" placeholder="Untitled">
            <div id="noteContent" class="editor-area" contenteditable="true"></div>

            <div class="actions" id="actions">
                <button class="save-btn" onclick="saveNote()">Save</button>
                <button class="delete-btn" onclick="confirmDelete()">Delete</button>
            </div>

        </div>

    </div>
    <!-- DELETE MODAL -->
    <div id="deleteModal" class="modal">
        <div class="modal-box">
            <p>Are you sure you want to delete this note?</p>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="confirm-btn" onclick="deleteNote()">Delete</button>
            </div>
        </div>
    </div>
    <script>
        let notes = [];
        let currentIndex = null;
        let saveTimeout;

        function showEditor() {
            document.getElementById('quoteBox').style.display = 'none';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('noteTitle').style.display = 'block';
            document.getElementById('noteContent').style.display = 'block';
            document.getElementById('actions').style.display = 'block';
        }

        function hideEditor() {
            document.getElementById('quoteBox').style.display = 'block';
            document.getElementById('toolbar').style.display = 'none';
            document.getElementById('noteTitle').style.display = 'none';
            document.getElementById('noteContent').style.display = 'none';
            document.getElementById('actions').style.display = 'none';
        }

        function format(cmd, val = null) {
            document.execCommand(cmd, false, val);

            // 👇 highlight button immediately on click
            const btnMap = {
                bold: 'boldBtn',
                italic: 'italicBtn',
                underline: 'underlineBtn',
                justifyLeft: 'leftBtn',
                justifyCenter: 'centerBtn',
                justifyRight: 'rightBtn',
                insertUnorderedList: 'ulBtn',
                insertOrderedList: 'olBtn'
            };

            if (btnMap[cmd]) {
                document.getElementById(btnMap[cmd]).classList.toggle('active');
            }

            // keep toolbar synced
            updateToolbar();
        }

        function renderNotes() {
            const list = document.getElementById('notesList');
            const empty = document.getElementById('emptyState');
            list.innerHTML = '';

            if (notes.length === 0) { empty.style.display = 'block' }
            else { empty.style.display = 'none' }

            notes.forEach((n, i) => {
                const d = document.createElement('div');
                d.className = 'note-item' + (i === currentIndex ? ' active' : '');
                d.innerHTML = `<div class="note-title">${n.title || 'Untitled'}</div>`;
                d.onclick = () => loadNote(i);
                list.appendChild(d);
            });
        }

        function addNote() {
            notes.unshift({ title: '', content: '' });
            currentIndex = 0;
            showEditor();
            renderNotes();
            loadNote(0);
        }

        function loadNote(i) {
            currentIndex = i;
            showEditor();
            noteTitle.value = notes[i].title;
            noteContent.innerHTML = notes[i].content;
            renderNotes();
        }

        function saveNote() {
            if (currentIndex === null) return;

            fetch('/save-diary', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: notes[currentIndex].id || null,
                    title: noteTitle.value,
                    content: noteContent.innerHTML
                })
            })
                .then(res => res.json())
                .then(data => {
                    // 🔥 VERY IMPORTANT
                    notes[currentIndex].id = data.id;

                    notes[currentIndex].title = noteTitle.value;
                    notes[currentIndex].content = noteContent.innerHTML;

                    renderNotes();
                    const saveBtn = document.querySelector('.save-btn');
                    const originalText = saveBtn.textContent;

                    saveBtn.textContent = "Saved ✔";
                    saveBtn.disabled = true;

                    setTimeout(() => {
                        saveBtn.textContent = originalText;
                        saveBtn.disabled = false;
                    }, 1500);
                });
        }

        function updateToolbar() {
            document.getElementById('boldBtn').classList.toggle('active', document.queryCommandState('bold'));
            document.getElementById('italicBtn').classList.toggle('active', document.queryCommandState('italic'));
            document.getElementById('underlineBtn').classList.toggle('active', document.queryCommandState('underline'));

            document.getElementById('leftBtn').classList.toggle('active', document.queryCommandState('justifyLeft'));
            document.getElementById('centerBtn').classList.toggle('active', document.queryCommandState('justifyCenter'));
            document.getElementById('rightBtn').classList.toggle('active', document.queryCommandState('justifyRight'));

            document.getElementById('ulBtn').classList.toggle('active', document.queryCommandState('insertUnorderedList'));
            document.getElementById('olBtn').classList.toggle('active', document.queryCommandState('insertOrderedList'));
        }
        noteContent.addEventListener('keyup', updateToolbar);
        noteContent.addEventListener('mouseup', updateToolbar);

        function confirmDelete() {
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }

        function deleteNote() {
            closeModal();

            if (currentIndex === null) return;

            const noteId = notes[currentIndex].id;

            fetch('/delete-diary/' + noteId, {
                method: 'DELETE'
            });

            notes.splice(currentIndex, 1);
            currentIndex = null;

            renderNotes();
            hideEditor();
        }

        function autoSave() {
            clearTimeout(saveTimeout);

            saveTimeout = setTimeout(() => {
                saveNote();
            }, 1000); // waits 1 second after typing stops
        }


        hideEditor();
        fetch('/get-diary')
            .then(res => res.json())
            .then(data => {
                notes = data;
                renderNotes();
            });
    </script>

</body>

</html>
