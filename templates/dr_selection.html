<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Zenzest - Login</title>
    <link rel="icon" type="image/png" href="../static/assets/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* MAIN CARD */
        .container {
            width: 900px;
            /* reduced from 1100px */
            height: 560px;
            /* reduced from 650px */
            background: #fff;
            display: flex;
            border-radius: 10px;
            overflow: hidden;
        }

        /* LEFT SIDE */
        .left {
            width: 50%;
            padding: 50px 60px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 70px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        /* FORM */
        form label {
            font-size: 13px;
            display: block;
            margin: 10px 0 5px;
        }

        .form-box input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            outline: none;
        }

        /* CHECKBOX */
        .checkbox {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;

            font-size: 12px;
            color: #000000;
            margin: 15px 0;

            width: 100%;
            background-color: transparent;
        }

        .checkbox span {
            white-space: nowrap;
        }

        .checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background: #111;
            color: white;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        .login-text {
            margin-top: 20px;
            font-size: 13px;
            text-align: center;
        }

        .login-text a {
            color: #000;
            font-weight: 500;
            text-decoration: none;
        }

        .forgot {
            text-align: end;
            color: #000;
            font-weight: 500;
            font-size: 12px;
            margin: 10px 0;
            text-decoration: none;
        }

        /* RIGHT SIDE */
        .right {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* IMAGE CARD */
        .image-card {
            width: 80%;
            height: 80%;
        }

        .image-card img {
            width: 100%;
            height: 100%;
        }
        .search-btn, .confirm-btn {
            width: 100%;
            padding: 12px;
            background: #111;
            color: white;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        .doctor-selector {
            position: relative;
        }

        .doctor-suggestions {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
            z-index: 20;
            max-height: 220px;
            overflow-y: auto;
        }

        .doctor-suggestions button {
            width: 100%;
            background: #fff;
            border: none;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            color: #111827;
        }

        .doctor-suggestions button:hover {
            background: #f3f4f6;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left">
            <div class="logo">◎ ZENZEST</div>

            <h2>Select Your Counsellor</h2>

            <div class="form-box">

                <div class="doctor-selector">
                    <input type="text" id="doctorEmail" placeholder="Type doctor name or email" autocomplete="off">
                    <div id="doctorSuggestions" class="doctor-suggestions" style="display:none;"></div>
                </div>

                <button type="button" onclick="checkDoctor()" class="search-btn">
                    Search
                </button>

                <div id="result" style="margin-top: 10px;"></div>

                <!-- Separate form (NOT nested) -->
                <form method="POST" action="/confirm-doctor" id="confirmForm" style="display:none; margin-bottom: 20px;">
                    <input type="hidden" name="doctor_email" id="hiddenEmail">
                    <input type="hidden" name="doctor_name" id="hiddenName">

                    <button type="submit" class="confirm-btn">
                        Confirm Your Doctor
                    </button>
                </form>

            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="right">
            <div class="image-card">
                <img src="../static/assets/sign_in_image.png" />
            </div>
        </div>
    </div>

</body>
<script>
    let counsellors = [];

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function loadCounsellors() {
        return fetch('/get-counsellor-list')
            .then(res => res.json())
            .then(data => {
                counsellors = data;
                return data;
            });
    }

    function renderDoctorSuggestions(query = '') {
        const term = (query || '').toLowerCase().trim();
        const box = document.getElementById('doctorSuggestions');

        const showMatches = data => {
            const filtered = data.filter(item =>
                item.name.toLowerCase().includes(term) || item.email.toLowerCase().includes(term)
            );

            if (!term || filtered.length === 0) {
                box.style.display = 'none';
                box.innerHTML = '';
                return;
            }

            box.innerHTML = filtered.map(item => `
                <button type="button" class="suggestion-item" data-name="${escapeHtml(item.name)}" data-email="${escapeHtml(item.email)}">
                    ${escapeHtml(item.name)} - ${escapeHtml(item.email)}
                </button>
            `).join('');

            box.style.display = 'block';

            box.querySelectorAll('.suggestion-item').forEach(btn => {
                btn.addEventListener('click', function () {
                    document.getElementById('doctorEmail').value = `${this.dataset.name} - ${this.dataset.email}`;
                    document.getElementById('hiddenName').value = this.dataset.name;
                    document.getElementById('hiddenEmail').value = this.dataset.email;
                    box.style.display = 'none';
                });
            });
        };

        if (counsellors.length) {
            showMatches(counsellors);
            return;
        }

        loadCounsellors().then(showMatches);
    }

    document.getElementById('doctorEmail').addEventListener('input', function () {
        document.getElementById('hiddenName').value = '';
        document.getElementById('hiddenEmail').value = '';
        renderDoctorSuggestions(this.value);
    });

    document.addEventListener('click', function (event) {
        const selector = document.querySelector('.doctor-selector');
        if (!selector.contains(event.target)) {
            document.getElementById('doctorSuggestions').style.display = 'none';
        }
    });

    function checkDoctor() {
        const selectedEmail = document.getElementById('hiddenEmail').value;
        const typedValue = document.getElementById('doctorEmail').value;
        const email = selectedEmail || typedValue;

        fetch('/check-doctor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        })
            .then(res => res.json())
            .then(data => {
                const resultDiv = document.getElementById('result');
                const form = document.getElementById('confirmForm');

                if (data.status === 'found') {
                    resultDiv.innerHTML = `
                <p><strong>Name:</strong> ${escapeHtml(data.name)}</p>
                <p><strong>Email:</strong> ${escapeHtml(data.email)}</p>
            `;

                    document.getElementById('hiddenEmail').value = data.email;
                    document.getElementById('hiddenName').value = data.name;

                    form.style.display = 'block';

                } else {
                    resultDiv.innerHTML = '<p style="color:red;">Doctor not found</p>';
                    form.style.display = 'none';
                }
            });
    }

    loadCounsellors();
</script>

</html>
