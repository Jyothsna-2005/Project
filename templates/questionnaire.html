<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenzest - Questionnaire</title>
    <link rel="icon" type="image/png" href="../static/assets/favicon.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 650px;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .exit-cross {
            position: absolute;
            top: -15px;
            right: -15px;
            background: black;
            color: white;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #0b0b0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #393939;
        }

        .question {
            margin-top: 25px;
            font-size: 18px;
        }

        .option {
            margin-top: 15px;
            border: 1px solid black;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .option:hover {
            background: #f9f9f9;
        }

        .option input {
            margin-right: 15px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            border: 1px solid black;
            background: black;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
        }

        button:hover {
            background: #353535;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="exit-cross" id="exitBtn">✕</div>

        <div class="header">
            <h3>Question 1</h3>
            <div class="progress-circle">1/10</div>
        </div>

        <div class="question"></div>

        <label class="option"><input type="radio" name="q1"> A</label>
        <label class="option"><input type="radio" name="q1"> B</label>
        <label class="option"><input type="radio" name="q1"> C</label>
        <label class="option"><input type="radio" name="q1"> D</label>

        <div class="buttons">
            <button id="prevBtn">← Previous</button>
            <button id="nextBtn">Next →</button>
        </div>
    </div>

    <!-- Exit Modal -->
    <div id="exitModal" class="modal">
        <div class="modal-content">
            <h3>Exit Quiz?</h3>
            <p>Are you sure you want to exit?</p>
            <div class="modal-buttons">
                <button id="confirmExit">Yes</button>
                <button id="cancelExit">Cancel</button>
            </div>
        </div>
    </div>

</body>

<script>
    // VARIABLES
    let allQuestions = [];
    let questions = [];
    let currentQuestion = 0;
    let userAnswers = [];
    let totalScore = 0;

    const questionText = document.querySelector(".question");
    const options = document.querySelectorAll(".option");
    const progress = document.querySelector(".progress-circle");
    const header = document.querySelector(".header h3");

    // RANDOM SELECT FUNCTION (UNCHANGED)
    function getRandomQuestions(arr, num) {
        return [...arr].sort(() => 0.5 - Math.random()).slice(0, num);
    }

    // FETCH QUESTIONS FROM DATABASE
    fetch('/get-questions')
        .then(res => res.json())
        .then(data => {

            allQuestions = data;

            // pick 10 random questions
            questions = getRandomQuestions(allQuestions, 10);

            userAnswers = new Array(questions.length).fill(null);

            loadQuestion(); // start after loading
        });

    // LOAD QUESTION (SAME LOGIC, safer rendering)
    function loadQuestion() {
        const q = questions[currentQuestion];
        questionText.textContent = q.question;

        options.forEach((opt, i) => {
            opt.innerHTML = `
                <input type="radio" name="q1" ${userAnswers[currentQuestion] === i ? "checked" : ""}>
                ${q.options[i].text}
            `;
        });

        progress.textContent = (currentQuestion + 1) + "/10";
        header.textContent = "Question " + (currentQuestion + 1);
    }

    // NEXT BUTTON (UNCHANGED)
    document.getElementById("nextBtn").onclick = () => {
        let selected = [...options].findIndex(o => o.querySelector("input")?.checked);
        if (selected === -1) return alert("Select an option");

        userAnswers[currentQuestion] = selected;

        if (currentQuestion < 9) {
            currentQuestion++;
            loadQuestion();
        } else {
            calculateScore();
            showResult();
        }
    };

    // PREVIOUS BUTTON (UNCHANGED)
    document.getElementById("prevBtn").onclick = () => {
        if (currentQuestion > 0) {
            currentQuestion--;
            loadQuestion();
        }
    };

    // SCORE CALCULATION (UNCHANGED)
    function calculateScore() {
        totalScore = 0;
        userAnswers.forEach((ans, i) => {
            if (ans !== null) totalScore += questions[i].options[ans].score;
        });
    }

    // RESULT DISPLAY (UNCHANGED)
    function showResult() {
        let feedback = "", tip = "";

        let percentage = Math.round((totalScore / 30) * 100);

        if (percentage >= 75) {
            feedback = "😊 Good mental health!";
            tip = "Keep up your positive habits!";
        } else if (percentage >= 50) {
            feedback = "😐 Moderate mental health.";
            tip = "Try relaxation and talking to others.";
        } else {
            feedback = "⚠️ Needs attention.";
            tip = "Practice self-care and seek support.";
        }

        // SAVE TO DATABASE
        fetch('/save-questionnaire', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                score: totalScore,
                percentage: percentage
            })
        });

        document.querySelector(".container").innerHTML = `
        <div style="text-align:center;">
            <h2>Completed!</h2>
            <h1 style="color:#ff6a00;">${percentage}/100</h1>
            <h3>${feedback}</h3>
            <p>${tip}</p>

            <button onclick="window.location.href='/Questionnaire - Start'" style="margin-top:15px;">
                Exit
            </button>
        </div>`;
    }

    // EXIT MODAL (UNCHANGED)
    const modal = document.getElementById("exitModal");

    document.getElementById("exitBtn").onclick = () => modal.style.display = "flex";
    document.getElementById("cancelExit").onclick = () => modal.style.display = "none";
    document.getElementById("confirmExit").onclick = () => window.location.href = '/Questionnaire - Start';

</script>

</html>
