<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match Card Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Intro Screen */
        #introScreen {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: rgba(0, 0, 0, 0.02) 0px 1px 3px 0px, rgba(27, 31, 35, 0.15) 0px 0px 0px 1px;
        }

        #introScreen h1 {
            font-size: 3em;
            color: #303030;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        #introScreen p {
            font-size: 1.2em;
            color: #666;
            line-height: 1.6;
        }

        /* Game Screen */
        #gameScreen {
            display: none;
        }

        .game-header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .timer-section {
            text-align: center;
        }

        .timer-label {
            font-size: 0.9em;
            color: #303030;
            margin-bottom: 5px;
        }

        #timer {
            font-size: 2.5em;
            font-weight: bold;
            color: #303030;
            font-family: 'Courier New', monospace;
        }

        .moves-section {
            text-align: center;
        }

        .moves-label {
            font-size: 0.9em;
            color: #303030;
            margin-bottom: 5px;
        }

        #moveCount {
            font-size: 2.5em;
            font-weight: bold;
            color: #303030;
            font-family: 'Courier New', monospace;
        }

        .game-buttons {
            display: flex;
            gap: 10px;
        }

        #resultScreen {
            box-shadow: rgba(0, 0, 0, 0.02) 0px 1px 3px 0px, rgba(27, 31, 35, 0.15) 0px 0px 0px 1px;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }

        #resultScreen h2 {
            font-size: 3em;
            color: #282828;
        }

        .result-stats {
            border-radius: 15px;
            padding: 20px;
            margin: 10px;
        }

        .stat-item {
            font-size: 1.5em;
            color: #323232;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #323232;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .stat-value {
            font-size: 1.2em;
            color: #616161;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        #resultMessage {
            font-size: 1.5em;
            color: #262626;
            margin: 0px 0;
            font-weight: 500;
        }

        /* Card Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card {
            aspect-ratio: 1;
            cursor: pointer;
            perspective: 1000px;
            position: relative;
            height: 100px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            border-radius: 12px;
            font-size: 2.5em;
            font-weight: bold;
            user-select: none;
            transition: all 0.3s ease;
        }

        .card-front {
            background-color: #303030;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .card-front::after {
            content: '?';
            font-size: 2.5em;
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #f0f0f0;
        }

        .card:not(.disabled):hover .card-front {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .card.matched {
            opacity: 0.6;
        }

        .card.matched .card-back {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .card.disabled {
            pointer-events: none;
        }

        /* Buttons */
        button {
            background: white;
            color: #303030;
            box-shadow: rgba(0, 0, 0, 0.02) 0px 1px 3px 0px, rgba(27, 31, 35, 0.15) 0px 0px 0px 1px;
            border: none;
            padding: 15px 30px;
            font-size: 1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: white;
            color: #303030;
            box-shadow: rgba(0, 0, 0, 0.02) 0px 1px 3px 0px, rgba(27, 31, 35, 0.15) 0px 0px 0px 1px;
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(125, 125, 125, 0.6);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
                padding: 15px;
            }

            .card {
                height: 80px;
            }

            .card-front::after,
            .card-back {
                font-size: 2em;
            }

            .game-header {
                padding: 20px;
            }

            #introScreen h1 {
                color: #303030;
                font-size: 2em;
            }

            #resultScreen h2 {
                font-size: 1.8em;
            }

            button {
                padding: 12px 24px;
                font-size: 0.95em;
            }
        }

        /* Hidden */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Intro Screen -->
    <div class="container">
        <div id="introScreen">
            <h1><img src="../static/assets/memory-match.png" alt="" width="200px"><br> Memory Match</h1>
            <p>Test your memory by finding matching pairs of fruits!</p>
            <p style="font-size: 0.85em; color: #999;">Click cards to reveal the fruits and match pairs before time runs
                out.</p>
            <div class="button-group">
                <button onclick="startGame()">Start Game</button>
                <button class="btn-secondary" onclick="exitGame()">Exit</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen">
            <div class="game-header">
                <div class="timer-section">
                    <div class="timer-label">Time</div>
                    <div id="timer">0s</div>
                </div>
                <div class="moves-section">
                    <div class="moves-label">Moves</div>
                    <div id="moveCount">0</div>
                </div>
                <div class="game-buttons">
                    <button onclick="restartGame()">Restart</button>
                    <button class="btn-secondary" onclick="exitGame()">Exit</button>
                </div>
            </div>

            <div class="game-grid" id="gameGrid"></div>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="hidden">
            <h2>🎉 Congratulations!</h2>
            <div class="result-stats">
                <div class="stat-item">
                    <span class="stat-label">Time Taken:</span><br>
                    <span class="stat-value" id="finalTime">0s</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total Moves:</span><br>
                    <span class="stat-value" id="finalMoves">0</span>
                </div>
            </div>
            <div id="resultMessage"></div>
            <div class="button-group">
                <button onclick="startGame()">Play Again</button>
                <button class="btn-secondary" onclick="exitGame()">Exit</button>
            </div>
        </div>
    </div>

    <script>
        // Game State
        const gameState = {
            cards: [],
            flipped: [],
            matched: 0,
            moves: 0,
            seconds: 0,
            gameActive: false,
            timerInterval: null
        };

        // Fruit emojis
        const fruits = ['🍎', '🍌', '🍇', '🍉', '🍓', '🍒', '🍊', '🥝'];

        // Initialize game
        function initGame() {
            gameState.cards = [];
            gameState.flipped = [];
            gameState.matched = 0;
            gameState.moves = 0;
            gameState.seconds = 0;
            gameState.gameActive = true;

            // Create pairs
            const pairs = [...fruits, ...fruits];

            // Shuffle cards
            for (let i = pairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
            }

            gameState.cards = pairs.map((fruit, index) => ({
                id: index,
                fruit: fruit,
                flipped: false,
                matched: false
            }));

            renderGrid();
            startTimer();
        }

        function renderGrid() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            gameState.cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                if (card.flipped) cardEl.classList.add('flipped');
                if (card.matched) cardEl.classList.add('matched');

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back">${card.fruit}</div>
                    </div>
                `;

                if (!card.matched) {
                    cardEl.addEventListener('click', () => flipCard(index));
                } else {
                    cardEl.classList.add('disabled');
                }

                grid.appendChild(cardEl);
            });
        }

        function flipCard(index) {
            if (!gameState.gameActive) return;
            if (gameState.cards[index].flipped || gameState.cards[index].matched) return;
            if (gameState.flipped.length >= 2) return;

            gameState.cards[index].flipped = true;
            gameState.flipped.push(index);

            renderGrid();

            if (gameState.flipped.length === 2) {
                gameState.gameActive = false;
                gameState.moves++;
                updateMoveCount();
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = gameState.flipped;
            const match = gameState.cards[first].fruit === gameState.cards[second].fruit;

            if (match) {
                gameState.cards[first].matched = true;
                gameState.cards[second].matched = true;
                gameState.matched += 2;
                gameState.flipped = [];
                gameState.gameActive = true;
                renderGrid();

                if (gameState.matched === gameState.cards.length) {
                    setTimeout(() => {
                        endGame();
                    }, 500); // small delay allows UI to render properly
                }
            } else {
                setTimeout(() => {
                    gameState.cards[first].flipped = false;
                    gameState.cards[second].flipped = false;
                    gameState.flipped = [];
                    gameState.gameActive = true;
                    renderGrid();
                }, 1000);
            }
        }

        function startTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                gameState.seconds++;
                document.getElementById('timer').textContent = gameState.seconds + 's';
            }, 1000);
        }

        function updateMoveCount() {
            document.getElementById('moveCount').textContent = gameState.moves;
        }

        function startGame() {
            document.getElementById('introScreen').classList.add('hidden');
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('resultScreen').classList.add('hidden');
            initGame();
        }

        function restartGame() {
            clearInterval(gameState.timerInterval);
            startGame();
        }

        function endGame() {
            clearInterval(gameState.timerInterval);
            gameState.gameActive = false;

            // Performance message (your existing logic)
            let message = '';
            if (gameState.moves <= 12) message = '🌟 Perfect! You\'re a memory master!';
            else if (gameState.moves <= 18) message = '🎯 Great job! Well done!';
            else if (gameState.moves <= 25) message = '👍 Good effort! Nice work!';
            else message = '💪 You did it! Keep practicing!';

           saveScore();

            // Existing UI update
            document.getElementById('finalTime').textContent = gameState.seconds + 's';
            document.getElementById('finalMoves').textContent = gameState.moves;
            document.getElementById('resultMessage').textContent = message;

            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('resultScreen').classList.remove('hidden');
        }

        function exitGame() {
            clearInterval(gameState.timerInterval);
            window.location.href = "/Games";
        }

        function saveScore(){
             // 🔥 SAVE TO DATABASE (Flask)
            fetch('/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    game_name: "Memory Game",
                    score: gameState.moves,
                    time: gameState.seconds + 's',
                    moves: gameState.moves
                })
            });
        }

    </script>
</body>

</html>
