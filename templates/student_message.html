<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chat UI</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
        }

        /* Main container */
        .container {
            width: 60%;
            height: 500px;
            max-width: 1200px;
            margin: 60px auto;
            background: #f5f5f5;
            border-radius: 15px;
            display: flex;
            overflow: hidden;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
        }

        .user {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .user img {
            width: 40px;
            border-radius: 75%;
            margin-right: 10px;
        }

        .user span {
            font-size: 14px;
        }

        /* Chat section */
        .chat {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
        }

        .msg {
            max-width: 70%;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 14px;
        }

        .msg.left {
            background: #e4e4e4;
        }

        .msg.right {
            background: #5b7cff;
            color: white;
            margin-left: auto;
        }

        /* Input */
        .input-box {
            display: flex;
            margin-top: 10px;
        }

        .input-box input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
        }

        .input-box button {
            margin-left: 10px;
            padding: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #5b7cff;
            color: white;
            cursor: pointer;
        }

        /* Profile panel */
        .profile {
            width: 25%;
            background: #fafafa;
            padding: 20px;
            padding-top: 50px;
            border-left: 1px solid #ddd;
            text-align: center;
        }

        .profile img {
            width: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .profile h3 {
            margin: 5px 0;
        }

        .profile p {
            font-size: 13px;
            color: gray;
        }

        .actions button {
            margin: 10px 5px;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            background: #e4e4e4;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Profile -->
        <div class="profile">
            <img src="../static/assets/user_icon.png">
            <h3>Dianne Vanhorn</h3>
            <p>Councellor</p>
        </div>
        <!-- Chat -->
        <div class="chat">
            <div class="messages" id="chatBox"></div>

            <div class="input-box">
                <input type="text" id="msgInput" placeholder="Write something...">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>

    </div>

</body>
<script>
let doctorId = null;
let currentUserId = {{ user_id | tojson if user_id else 'null' }};

function showDoctorUnavailable() {
    const profile = document.querySelector('.profile');
    profile.innerHTML = `
        <img src="../static/assets/user_icon.png">
        <h3>Your consultant is no longer available</h3>
        <p>Choose a new doctor below to continue messaging.</p>
        <div style="margin-top: 12px; text-align:left; font-size: 13px; color: #555; position:relative;">
            <input id="doctorSearch" type="text" placeholder="Search doctor name or email" autocomplete="off" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;">
            <div id="doctorSuggestions" style="display:none;position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 10px 24px rgba(15,23,42,0.12);z-index:20;max-height:220px;overflow-y:auto;"></div>
            <button id="assignDoctorBtn" type="button" style="margin-top:10px;width:100%;padding:10px;border-radius:20px;border:none;background:#111;color:#fff;cursor:pointer;">Assign Doctor</button>
        </div>
    `;

    let counsellors = [];
    let selectedDoctor = null;
    const input = document.getElementById('doctorSearch');
    const suggestions = document.getElementById('doctorSuggestions');

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function renderDoctorSuggestions(query = '') {
        const term = query.toLowerCase().trim();
        const filtered = counsellors.filter(item =>
            item.name.toLowerCase().includes(term) || item.email.toLowerCase().includes(term)
        );

        if (!term || filtered.length === 0) {
            suggestions.style.display = 'none';
            suggestions.innerHTML = '';
            return;
        }

        suggestions.innerHTML = filtered.map(item => `
            <button type="button" class="doctor-suggestion-item" data-name="${escapeHtml(item.name)}" data-email="${escapeHtml(item.email)}" style="width:100%;background:#fff;border:none;padding:10px 12px;text-align:left;cursor:pointer;font-size:13px;color:#111827;">
                ${escapeHtml(item.name)} - ${escapeHtml(item.email)}
            </button>
        `).join('');

        suggestions.style.display = 'block';

        suggestions.querySelectorAll('.doctor-suggestion-item').forEach(btn => {
            btn.addEventListener('mouseenter', function () {
                this.style.background = '#f3f4f6';
            });
            btn.addEventListener('mouseleave', function () {
                this.style.background = '#fff';
            });
            btn.addEventListener('click', function () {
                selectedDoctor = {
                    name: this.dataset.name,
                    email: this.dataset.email
                };
                input.value = `${selectedDoctor.name} - ${selectedDoctor.email}`;
                suggestions.style.display = 'none';
            });
        });
    }

    fetch('/get-counsellor-list')
        .then(res => res.json())
        .then(data => {
            counsellors = data;
        });

    input.addEventListener('input', function () {
        selectedDoctor = null;
        renderDoctorSuggestions(this.value);
    });

    document.addEventListener('click', function (event) {
        if (!input.contains(event.target) && !suggestions.contains(event.target)) {
            suggestions.style.display = 'none';
        }
    });

    document.getElementById('assignDoctorBtn').addEventListener('click', () => {
        if (!selectedDoctor) {
            alert('Please choose a doctor from the list.');
            return;
        }

        fetch('/reassign-doctor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ doctor_name: selectedDoctor.name, doctor_email: selectedDoctor.email })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'ok') {
                window.location.reload();
            } else {
                alert(data.message || 'Unable to assign doctor.');
            }
        });
    });
}

/* Step 1: Get doctor details */
fetch('/get-doctor')
.then(res => res.json())
.then(data => {
    if (!data || !data.email) {
        showDoctorUnavailable();
        return null;
    }

    document.querySelector('.profile h3').innerText = data.name;

    return fetch('/get-user-id-by-email', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email: data.email })
    });
})
.then(res => {
    if (!res) return null;
    return res.json();
})
.then(data => {
    if (!data || !data.user_id) return;

    doctorId = data.user_id;

    loadMessages();
    setInterval(loadMessages, 2000);
})
.catch(err => console.error(err));

/* Load messages */
function loadMessages() {
    if (!doctorId) return;

    fetch(`/get-messages/${doctorId}`)
    .then(res => res.json())
    .then(data => {
        let chat = document.getElementById('chatBox');
        chat.innerHTML = '';

        data.forEach(msg => {
            let div = document.createElement('div');
            div.classList.add('msg');

            if (msg.sender == currentUserId) {
                div.classList.add('right');
            } else {
                div.classList.add('left');
            }

            div.innerText = msg.message;
            chat.appendChild(div);
        });

        chat.scrollTop = chat.scrollHeight;
    })
    .catch(err => {
        console.error("Message load error:", err);
    });
}

/* Send message */
function sendMessage() {
    let input = document.getElementById('msgInput');
    let text = input.value.trim();

    if (!text || !doctorId) return;

    fetch('/send-message', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            receiver_id: doctorId,
            message: text
        })
    }).then(() => {
        input.value = '';
        loadMessages();
    });
}
</script>
<script>
document.getElementById("msgInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
</script>
</html>
